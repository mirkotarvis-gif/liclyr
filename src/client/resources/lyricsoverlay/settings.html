<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lyrics Overlay – Settings</title>
<style>
  :root {
    --bg: #0f0f14; --panel: #17171f; --panel2: #1e1e28; --line: #2a2a36;
    --text: #ececf1; --dim: #9a9aab; --accent: #ff7a30; --accent2: #ffb27a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 "Segoe UI", system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: rgba(15,15,20,.92); backdrop-filter: blur(8px);
           border-bottom: 1px solid var(--line); padding: 14px 22px; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; letter-spacing: .3px; }
  h1 span { color: var(--accent); }
  #status { flex: 1; min-width: 260px; color: var(--dim); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #status b { color: var(--text); font-weight: 600; }
  #saved { color: var(--accent2); font-size: 12px; opacity: 0; transition: opacity .3s; }
  #saved.on { opacity: 1; }
  main { max-width: 1180px; margin: 0 auto; padding: 18px 22px 60px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; align-items: center; }
  .bar .lbl { color: var(--dim); margin-right: 4px; font-size: 13px; }
  button { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
           padding: 7px 12px; cursor: pointer; font: inherit; font-size: 13px; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #1a0d04; font-weight: 600; }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .tab { padding: 8px 16px; border-radius: 999px; }
  .tab.on { background: var(--accent); color: #1a0d04; border-color: var(--accent); font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px 10px; }
  .card h3 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--accent2); display:flex; justify-content:space-between; align-items:center; }
  .row { display: grid; grid-template-columns: 130px 1fr 54px; gap: 10px; align-items: center; min-height: 34px; }
  .row label { color: var(--dim); font-size: 13px; }
  .row .val { color: var(--dim); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
  .row.off { opacity: .4; pointer-events: none; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  input[type=color] { width: 44px; height: 28px; border: 1px solid var(--line); border-radius: 6px; background: none; padding: 0 2px; cursor: pointer; }
  .colorwrap { display: flex; gap: 8px; align-items: center; }
  .colorwrap input[type=text] { width: 92px; }
  input[type=text], select { width: 100%; background: var(--panel2); color: var(--text); border: 1px solid var(--line);
           border-radius: 6px; padding: 6px 8px; font: inherit; font-size: 13px; }
  .switch { position: relative; width: 40px; height: 22px; display: inline-block; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; background: #3a3a48; border-radius: 22px; transition: .2s; cursor: pointer; }
  .switch span:before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span:before { transform: translateX(18px); }
  .hint { color: var(--dim); font-size: 12px; margin: 2px 0 8px; }
  .fontsearch { margin-bottom: 4px; }
  .hidden { display: none; }
  code { background: var(--panel2); padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<header>
  <h1>♪ Lyrics <span>Overlay</span></h1>
  <div id="status">Connecting…</div>
  <div id="saved">✓ applied</div>
</header>
<main>
  <div class="bar">
    <button class="primary" onclick="api('POST','/api/edit')">Move / resize in game</button>
    <button onclick="api('POST','/api/reload-lyrics')">Search lyrics again</button>
    <button onclick="api('POST','/api/open-fonts')">Open fonts folder</button>
    <button onclick="resetAll()">Reset everything</button>
  </div>
  <div class="bar" id="presets"><span class="lbl">Lyric presets:</span></div>
  <div class="tabs">
    <button class="tab on" data-tab="lyrics">Lyrics</button>
    <button class="tab" data-tab="card">Now-playing card</button>
    <button class="tab" data-tab="behavior">Timing & behaviour</button>
  </div>
  <div id="pane-lyrics" class="grid"></div>
  <div id="pane-card" class="grid hidden"></div>
  <div id="pane-behavior" class="grid hidden"></div>
</main>

<script>
const TOKEN = new URLSearchParams(location.search).get('t') || '';
let cfg = null, defaults = null, fonts = ['Minecraft'];

async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { 'X-Token': TOKEN, 'Content-Type': 'application/json' },
                                body: body === undefined ? undefined : JSON.stringify(body) });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

// ------------------------------------------------------------------ schema
const T = (k, label, extra = {}) => ({ k, label, type: 'toggle', ...extra });
const R = (k, label, min, max, step, extra = {}) => ({ k, label, type: 'range', min, max, step, ...extra });
const C = (k, label, extra = {}) => ({ k, label, type: 'color', ...extra });
const S = (k, label, options, extra = {}) => ({ k, label, type: 'select', options, ...extra });
const F = (k, label, extra = {}) => ({ k, label, type: 'font', ...extra });

const SCHEMA = {
  lyrics: [
    { title: 'Text', master: 'lyrics.show', fields: [
      T('lyrics.show', 'Show lyrics'),
      F('lyrics.font', 'Font'),
      R('lyrics.fontSize', 'Size', 8, 140, 1),
      T('lyrics.bold', 'Bold'), T('lyrics.italic', 'Italic'), T('lyrics.uppercase', 'ALL CAPS'),
      R('lyrics.letterSpacing', 'Letter spacing', -0.1, 0.6, 0.01, { ttfOnly: true }),
      S('lyrics.align', 'Align', ['left', 'center', 'right']),
      R('lyrics.maxWidth', 'Max width (wrap)', 0.2, 1, 0.01, { pct: true }),
    ]},
    { title: 'Colour', fields: [
      C('lyrics.color', 'Colour'),
      T('lyrics.gradient', 'Gradient', { ttfOnly: true }),
      C('lyrics.color2', 'Gradient end', { needs: 'lyrics.gradient', ttfOnly: true }),
      R('lyrics.opacity', 'Opacity', 0.05, 1, 0.01, { pct: true }),
    ]},
    { title: 'Glow', master: 'lyrics.glow', fields: [
      T('lyrics.glow', 'Glow'),
      C('lyrics.glowColor', 'Glow colour', { needs: 'lyrics.glow' }),
      R('lyrics.glowSize', 'Glow size', 1, 40, 0.5, { needs: 'lyrics.glow' }),
      R('lyrics.glowStrength', 'Glow strength', 0.1, 4, 0.05, { needs: 'lyrics.glow' }),
    ]},
    { title: 'Outline & shadow', fields: [
      T('lyrics.outline', 'Outline'),
      C('lyrics.outlineColor', 'Outline colour', { needs: 'lyrics.outline' }),
      R('lyrics.outlineWidth', 'Outline width', 0.5, 8, 0.25, { needs: 'lyrics.outline' }),
      T('lyrics.shadow', 'Shadow'),
      C('lyrics.shadowColor', 'Shadow colour', { needs: 'lyrics.shadow' }),
      R('lyrics.shadowOffset', 'Shadow offset', 0, 12, 0.5, { needs: 'lyrics.shadow' }),
      R('lyrics.shadowBlur', 'Shadow blur', 0, 20, 0.5, { needs: 'lyrics.shadow', ttfOnly: true }),
    ]},
    { title: 'Background box', fields: [
      T('lyrics.background', 'Background'),
      C('lyrics.bgColor', 'Colour', { needs: 'lyrics.background' }),
      R('lyrics.bgOpacity', 'Opacity', 0, 1, 0.01, { needs: 'lyrics.background', pct: true }),
      R('lyrics.bgPadding', 'Padding', 0, 40, 1, { needs: 'lyrics.background' }),
      R('lyrics.bgRadius', 'Corner radius', 0, 30, 1, { needs: 'lyrics.background', ttfOnly: true }),
    ]},
    { title: 'Animation (new line replaces old)', fields: [
      S('lyrics.animation', 'Style', ['slide_up', 'slide_down', 'fade', 'pop', 'zoom', 'wipe', 'none']),
      R('lyrics.fadeInMs', 'In duration (ms)', 0, 1500, 10),
      R('lyrics.fadeOutMs', 'Out duration (ms)', 0, 1500, 10),
    ]},
    { title: 'Position & size', fields: [
      R('lyrics.x', 'Horizontal', 0, 1, 0.001, { pct: true }),
      R('lyrics.y', 'Vertical', 0, 1, 0.001, { pct: true }),
      R('lyrics.scale', 'Scale', 0.25, 5, 0.01, { mult: true }),
    ]},
  ],
  card: [
    { title: 'Card', master: 'card.show', fields: [
      T('card.show', 'Show card'),
      R('card.x', 'Horizontal', 0, 0.98, 0.001, { pct: true }),
      R('card.y', 'Vertical', 0, 0.98, 0.001, { pct: true }),
      R('card.scale', 'Scale', 0.25, 5, 0.01, { mult: true }),
      R('card.width', 'Width', 100, 700, 1),
      T('card.hideWhenPaused', 'Hide when paused'),
    ]},
    { title: 'Background', fields: [
      T('card.background', 'Background'),
      C('card.bgColor', 'Colour', { needs: 'card.background' }),
      R('card.bgOpacity', 'Opacity', 0, 1, 0.01, { needs: 'card.background', pct: true }),
      R('card.cornerRadius', 'Corner radius', 0, 30, 0.5, { needs: 'card.background' }),
      T('card.border', 'Border', { needs: 'card.background' }),
      C('card.borderColor', 'Border colour', { needs: 'card.border' }),
      R('card.padding', 'Padding', 0, 30, 0.5),
    ]},
    { title: 'Album cover', fields: [
      T('card.showCover', 'Show cover'),
      R('card.coverSize', 'Size', 16, 160, 1, { needs: 'card.showCover' }),
      R('card.coverRadius', 'Corner radius', 0, 40, 0.5, { needs: 'card.showCover' }),
    ]},
    { title: 'Text', fields: [
      F('card.font', 'Font'),
      T('card.textShadow', 'Text shadow'),
      T('card.showTitle', 'Title'),
      C('card.titleColor', 'Title colour', { needs: 'card.showTitle' }),
      R('card.titleSize', 'Title size', 6, 40, 0.5, { needs: 'card.showTitle' }),
      T('card.titleBold', 'Title bold', { needs: 'card.showTitle', ttfOnly: true }),
      T('card.showArtist', 'Artist'),
      C('card.artistColor', 'Artist colour', { needs: 'card.showArtist' }),
      R('card.artistSize', 'Artist size', 6, 40, 0.5, { needs: 'card.showArtist' }),
      T('card.showAlbum', 'Album'),
      C('card.albumColor', 'Album colour'),
      R('card.albumSize', 'Album size', 6, 40, 0.5),
      T('card.showSource', 'Show app ("via Spotify")'),
    ]},
    { title: 'Progress', fields: [
      T('card.showProgress', 'Progress bar'),
      T('card.showTimes', 'Times'),
      C('card.accentColor', 'Bar colour'),
      C('card.trackColor', 'Bar background'),
      R('card.barHeight', 'Bar height', 1, 12, 0.5),
      C('card.timeColor', 'Time colour'),
      R('card.timeSize', 'Time size', 6, 30, 0.5),
    ]},
  ],
  behavior: [
    { title: 'Timing', fields: [
      R('behavior.offsetMs', 'Lyric offset (ms)', -3000, 3000, 10, { hint: 'Lyrics late? push it up. Early? pull it down.' }),
      R('behavior.hideAfterSec', 'Hide line after (s)', 0, 30, 0.5, { hint: 'During long instrumental parts. 0 = never.' }),
    ]},
    { title: 'Behaviour', fields: [
      T('enabled', 'Overlay enabled'),
      T('behavior.hideLyricsWhenPaused', 'Hide lyrics when paused'),
      T('behavior.hideWhenNothingPlaying', 'Hide card when nothing plays'),
    ]},
  ],
};

const PRESETS = {
  'Sunset glow': { color: '#FFE6CF', glow: true, glowColor: '#FF6A1F', glowSize: 10, glowStrength: 1.4, outline: false, shadow: false, background: false, gradient: false },
  'Clean white': { color: '#FFFFFF', glow: false, outline: false, shadow: true, shadowColor: '#000000', shadowOffset: 2, shadowBlur: 3, background: false, gradient: false },
  'Neon pink': { color: '#FFE0F4', glow: true, glowColor: '#FF2BD6', glowSize: 14, glowStrength: 1.8, outline: false, shadow: false, background: false, gradient: false },
  'Ice blue': { color: '#E8F7FF', glow: true, glowColor: '#3FB6FF', glowSize: 12, glowStrength: 1.5, outline: false, shadow: false, background: false, gradient: false },
  'Karaoke': { color: '#FFF27A', gradient: true, color2: '#FFB020', glow: false, outline: true, outlineColor: '#1A1A1A', outlineWidth: 2.5, shadow: false, background: false },
  'Subtitle box': { color: '#FFFFFF', glow: false, outline: false, shadow: false, background: true, bgColor: '#000000', bgOpacity: 0.55, bgPadding: 10, bgRadius: 6, gradient: false },
  'Minimal': { color: '#FFFFFF', opacity: 0.85, glow: false, outline: false, shadow: false, background: false, gradient: false },
};

// ------------------------------------------------------------------ helpers
const get = (path) => path.split('.').reduce((o, k) => o?.[k], cfg);
const set = (path, v) => { const ks = path.split('.'); let o = cfg; ks.slice(0, -1).forEach(k => o = o[k]); o[ks.at(-1)] = v; };

let saveTimer = null;
function changed() {
  refreshDeps();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try { await api('POST', '/api/config', cfg); flash(); } catch (e) { console.error(e); }
  }, 120);
}
function flash() { const s = document.getElementById('saved'); s.classList.add('on'); clearTimeout(flash.t); flash.t = setTimeout(() => s.classList.remove('on'), 900); }

function fmt(f, v) {
  if (f.pct) return Math.round(v * 100) + '%';
  if (f.mult) return v.toFixed(2) + '×';
  return Math.abs(f.step) < 1 ? (+v).toFixed(f.step < 0.05 ? 2 : 1) : String(Math.round(v));
}

const rows = [];
function build() {
  for (const [tab, groups] of Object.entries(SCHEMA)) {
    const pane = document.getElementById('pane-' + tab);
    pane.innerHTML = '';
    for (const g of groups) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<h3>${g.title}</h3>`;
      for (const f of g.fields) card.appendChild(buildRow(f));
      pane.appendChild(card);
    }
  }
  refreshDeps();
}

function buildRow(f) {
  const row = document.createElement('div');
  row.className = 'row';
  const lab = document.createElement('label');
  lab.textContent = f.label;
  row.appendChild(lab);
  const val = document.createElement('div');
  val.className = 'val';
  let input;
  const v = get(f.k);

  if (f.type === 'toggle') {
    input = document.createElement('label');
    input.className = 'switch';
    input.innerHTML = `<input type="checkbox"><span></span>`;
    const cb = input.querySelector('input');
    cb.checked = !!v;
    cb.onchange = () => { set(f.k, cb.checked); changed(); };
  } else if (f.type === 'range') {
    input = document.createElement('input');
    input.type = 'range'; input.min = f.min; input.max = f.max; input.step = f.step; input.value = v;
    val.textContent = fmt(f, v);
    input.oninput = () => { set(f.k, parseFloat(input.value)); val.textContent = fmt(f, +input.value); changed(); };
  } else if (f.type === 'color') {
    input = document.createElement('div');
    input.className = 'colorwrap';
    const c = document.createElement('input'); c.type = 'color'; c.value = (v || '#ffffff').slice(0, 7);
    const t = document.createElement('input'); t.type = 'text'; t.value = v || '#FFFFFF';
    c.oninput = () => { t.value = c.value.toUpperCase(); set(f.k, t.value); changed(); };
    t.onchange = () => { if (/^#?[0-9a-f]{6}$/i.test(t.value)) { t.value = ('#' + t.value.replace('#', '')).toUpperCase(); c.value = t.value; set(f.k, t.value); changed(); } };
    input.append(c, t);
  } else if (f.type === 'select') {
    input = document.createElement('select');
    for (const o of f.options) input.add(new Option(o.replace('_', ' '), o));
    input.value = v;
    input.onchange = () => { set(f.k, input.value); changed(); };
  } else if (f.type === 'font') {
    input = document.createElement('div');
    const search = document.createElement('input');
    search.type = 'text'; search.placeholder = 'Search fonts…'; search.className = 'fontsearch';
    const sel = document.createElement('select');
    const fill = (q) => {
      sel.innerHTML = '';
      const list = fonts.filter(n => !q || n.toLowerCase().includes(q.toLowerCase()) || n === get(f.k));
      for (const n of list) {
        const o = new Option(n === 'Minecraft' ? 'Minecraft (pixel)' : n, n);
        if (n !== 'Minecraft' && !n.startsWith('file:')) o.style.fontFamily = `"${n}"`;
        sel.add(o);
      }
      sel.value = get(f.k);
    };
    fill('');
    search.oninput = () => fill(search.value);
    sel.onchange = () => { set(f.k, sel.value); changed(); };
    input.append(search, sel);
    input._refill = fill;
  }
  row.appendChild(input);
  row.appendChild(val);
  rows.push({ f, row });
  const wrap = document.createElement('div');
  wrap.appendChild(row);
  if (f.hint) { const h = document.createElement('div'); h.className = 'hint'; h.textContent = f.hint; wrap.appendChild(h); }
  if (f.ttfOnly) { const h = document.createElement('div'); h.className = 'hint ttfnote hidden'; h.textContent = 'Not available with the Minecraft font'; wrap.appendChild(h); row._note = h; }
  return wrap;
}

function refreshDeps() {
  for (const { f, row } of rows) {
    let on = true;
    if (f.needs) on = !!get(f.needs);
    const section = f.k.split('.')[0];
    const isMc = (section === 'lyrics' || section === 'card') && get(section + '.font') === 'Minecraft';
    if (f.ttfOnly && isMc) on = false;
    row.classList.toggle('off', !on);
    if (row._note) row._note.classList.toggle('hidden', !(f.ttfOnly && isMc));
  }
}

function buildPresets() {
  const bar = document.getElementById('presets');
  for (const [name, p] of Object.entries(PRESETS)) {
    const b = document.createElement('button');
    b.textContent = name;
    b.onclick = () => { Object.assign(cfg.lyrics, p); rows.length = 0; build(); changed(); };
    bar.appendChild(b);
  }
}

async function resetAll() {
  if (!confirm('Reset all Lyrics Overlay settings?')) return;
  cfg = JSON.parse(JSON.stringify(defaults));
  rows.length = 0; build(); changed();
}

function fmtTime(ms) { const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
const LYR = { NONE: '–', LOADING: 'searching…', SYNCED: '✓ synced lyrics found', PLAIN_ONLY: 'only unsynced lyrics exist', INSTRUMENTAL: 'instrumental', NOT_FOUND: '✗ no lyrics found', ERROR: '✗ network error' };
async function pollStatus() {
  try {
    const s = await api('GET', '/api/status');
    const el = document.getElementById('status');
    if (s.title) {
      el.innerHTML = '';
      const b = document.createElement('b'); b.textContent = (s.artist ? s.artist + ' – ' : '') + s.title;
      el.append(s.playing ? '▶ ' : '❚❚ ', b, ` · ${s.source} · ${fmtTime(s.posMs)}${s.durMs ? ' / ' + fmtTime(s.durMs) : ''} · ${LYR[s.lyrics] || s.lyrics}`);
    } else {
      el.textContent = 'Nothing playing (' + s.media + ') – start a song in Spotify, YouTube, Apple Music…';
    }
  } catch (e) {
    document.getElementById('status').textContent = 'Not connected – is Minecraft running? (reopen this page with /lyrics settings)';
  }
}

document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
  for (const k of Object.keys(SCHEMA)) document.getElementById('pane-' + k).classList.toggle('hidden', k !== t.dataset.tab);
});

(async () => {
  try {
    [cfg, defaults, fonts] = await Promise.all([api('GET', '/api/config'), api('GET', '/api/defaults'), api('GET', '/api/fonts')]);
  } catch (e) {
    document.getElementById('status').textContent = 'Could not load settings. Open this page with /lyrics settings in game.';
    return;
  }
  buildPresets();
  build();
  pollStatus();
  setInterval(pollStatus, 1000);
  // pick up changes made in the in-game editor (dragging etc.) when you come back to this tab
  window.addEventListener('focus', async () => {
    try {
      const fresh = await api('GET', '/api/config');
      if (JSON.stringify(fresh) !== JSON.stringify(cfg)) { cfg = fresh; rows.length = 0; build(); }
    } catch (e) {}
  });
})();
</script>
</body>
</html>
